name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build all projects
        run: |
          mkdir -p out
          for z in *.zip; do
            n="${z%.zip}"
            mkdir -p "work/$n"
            unzip -o "$z" -d "work/$n"
            (cd "work/$n" && gradle build --no-daemon)
            cp work/$n/build/libs/*.jar out/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: out/*.jar
